# If any settings will not be found default parameter value will be used
#
# Read this page to know how to edit keys and mouse buttons from config
# https://gist.github.com/JekiTheMonkey/c40b346907ca0e3e8127f4fb0b5af1d5

[Keys]
Keys: Z,X

[Mouse]
Buttons: No

[Statistics text]
Statistics font: neuropol.ttf
Statistics text color: 255,255,255
Statistics character size: 13
Statistics bold: false
Statistics italic: false
Show statistics: true
Show max KPS on separate line: true
Show BPM: true

[Buttons text]
Key counters font: neuropol.ttf
Key counters text color: 255,255,255
Key counters character size: 14
# Text may not center due to font issues
Key counters width: 1
Key counters height: 1.35
Key counters bold: false
Key counters italic: false
Only show set keys: false
Show key counters: true

[Spacing]
# Distance from the borders and between the keys
Button distance: 7
# Distance between statistic lines
Statistics distance: 3
Space between buttons and statistics: 10
Space on the buttons right: 120

[Button graphics]
Button texture: Button.png
Button texture size: 50,50
Button texture color: 255,255,255

[Animation graphics]
Animation style: 1
Animation texture: Animation.png
Animation velocity: 20
# Style 1
Animation scale on click: 0.8
Animation color: 255,180,0
# Style 2
Animation offset: 3

[Background]
Background texture: Default
Background color: 25,25,25

[Edit mode]
Edit mode alert color: 255,180,0
Highlighted text button color: 210,30,210

[Theme developer]
# This is needed to test if key counters will fit in the window in a fast way
Value to multiply on click: 1

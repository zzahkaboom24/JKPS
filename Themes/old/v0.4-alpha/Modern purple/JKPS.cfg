[Keys]
Keys: D,F

[Mouse]
Buttons: No

[Statistics text]
Statistics font: One-Trick-Pony.ttf
Statistics text color: 255,255,255
Statistics character size: 26
Statistics bold: false
Statistics italic: false
Show statistics: true
Show max KPS on separate line: false
Show BPM: true

[Buttons text]
Key counters font: One-Trick-Pony.ttf
Key counters text color: 255,255,255
Key counters character size: 23
# Text may not center due to font issues
Key counters width: 0.98
Key counters height: 1.7
Key counters bold: false
Key counters italic: false
Only show set keys: false
Show key counters: true

[Spacing]
# Distance from the borders and between the keys
Button distance: 8
# Distance between statistic lines
Statistics distance: 3
Space between buttons and statistics: 10
Space on the buttons right: 130

[Button graphics]
Button texture: Button.png
Button texture size: 70,70
Button texture color: 255,255,255

[Animation graphics]
Animation style: 2
Animation texture: Animation.png
Animation velocity: 20
# Style 1
Animation scale on click: 1
Animation color: 0,0,0,0
# Style 2
Animation offset: 5

[Background]
Background texture: Default
Background color: 37,25,50

[Edit mode]
Edit mode alert color: 255,215,0
Highlighted text button color: 210,30,210

[Theme developer]
# This is needed to test if key counters will fit in the window in a fast way
Value to multiply on click: 1
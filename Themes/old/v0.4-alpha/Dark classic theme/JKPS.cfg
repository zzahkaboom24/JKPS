[Keys]
Keys: F,J,C,K,A,B

[Mouse]
Buttons: No

[Statistics text]
Statistics text font: Exo-Light.ttf
Statistics text color: 255,255,255
Statistics text character size: 15
Statistics text bold: false
Statistics text italic: false
Show statistics text: true
Show max KPS on separate line: true
Show BPM: true

[Buttons text]
Key counters font: Exo-Light.ttf
Key counters text color: 0,0,0
Key counters character size: 22
# Text may not center due to font issues
Key counters width: 1
Key counters height: 1.35
Key counters bold: false
Key counters italic: false
Only show set keys: false
Show key counters: true

[Spacing]
# Distance from the borders and between the keys
Button distance: 7
# Distance between statistic lines
Statistics distance: 3
Space between buttons and statistics: 10
Space on the buttons right: 100

[Button graphics]
Button texture: Button.png
Button texture size: 60,60
Button texture color: 255,255,255,129

[Animation graphics]
Animation style: 1
Animation texture: Animation.png
Animation velocity: 20
# Style 1
Animation scale on click: 1
Animation color: 233,219,44
# Style 2
Animation offset: 3

[Background]
Background texture: Background.png
Background color: 255,255,255

[Edit mode]
Edit mode alert color: 255,0,0
Highlighted text button color: 0,204,255

[Theme developer]
# This is needed to test if key counters will fit in the window in a fast way
Value to multiply on click: 1
